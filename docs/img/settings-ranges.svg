<svg xmlns="http://www.w3.org/2000/svg" width="820" height="478" viewBox="0 0 820 478" role="img" aria-label="Reader setting ranges and defaults" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title>Reader setting ranges and defaults</title><rect x="0" y="0" width="820" height="478" rx="0" fill="#ffffff"/><text x="30" y="34" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="start">What a reader can change, and the limits that always apply</text><text x="30" y="56" font-size="13" font-weight="400" fill="#4a4a4a" text-anchor="start">The dot marks the research default. The reader can move anywhere on the bar, never off it.</text><text x="30" y="118" font-size="14" font-weight="400" fill="#1a1a1a" text-anchor="start">Text size</text><rect x="210" y="108" width="440" height="10" rx="5" fill="#dcdcdc"/><rect x="210" y="108" width="440" height="10" rx="5" fill="#0b57d0"/><circle cx="307.77777777777777" cy="113" r="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="210" y="138" font-size="12" font-weight="400" fill="#4a4a4a" text-anchor="start">14px</text><text x="307.77777777777777" y="102" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">default 18px</text><text x="650" y="138" font-size="12" font-weight="400" fill="#4a4a4a" text-anchor="end">32px</text><text x="30" y="172" font-size="14" font-weight="400" fill="#1a1a1a" text-anchor="start">Font weight</text><rect x="210" y="162" width="440" height="10" rx="5" fill="#dcdcdc"/><rect x="210" y="162" width="440" height="10" rx="5" fill="#0b57d0"/><circle cx="320" cy="167" r="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="210" y="192" font-size="12" font-weight="400" fill="#4a4a4a" text-anchor="start">300</text><text x="320" y="156" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">default 400</text><text x="650" y="192" font-size="12" font-weight="400" fill="#4a4a4a" text-anchor="end">700</text><text x="30" y="226" font-size="14" font-weight="400" fill="#1a1a1a" text-anchor="start">Line height</text><rect x="210" y="216" width="440" height="10" rx="5" fill="#dcdcdc"/><rect x="210" y="216" width="440" height="10" rx="5" fill="#0b57d0"/><circle cx="342" cy="221" r="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="210" y="246" font-size="12" font-weight="400" fill="#4a4a4a" text-anchor="start">1.2</text><text x="342" y="210" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">default 1.5</text><text x="650" y="246" font-size="12" font-weight="400" fill="#4a4a4a" text-anchor="end">2.2</text><text x="30" y="280" font-size="14" font-weight="400" fill="#1a1a1a" text-anchor="start">Letter spacing</text><rect x="210" y="270" width="440" height="10" rx="5" fill="#dcdcdc"/><rect x="210" y="270" width="440" height="10" rx="5" fill="#0b57d0"/><circle cx="258.8888888888889" cy="275" r="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="210" y="300" font-size="12" font-weight="400" fill="#4a4a4a" text-anchor="start">-0.02em</text><text x="258.8888888888889" y="264" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">default 0em</text><text x="650" y="300" font-size="12" font-weight="400" fill="#4a4a4a" text-anchor="end">0.16em</text><text x="30" y="334" font-size="14" font-weight="400" fill="#1a1a1a" text-anchor="start">Word spacing</text><rect x="210" y="324" width="440" height="10" rx="5" fill="#dcdcdc"/><rect x="210" y="324" width="440" height="10" rx="5" fill="#0b57d0"/><circle cx="210" cy="329" r="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="210" y="354" font-size="12" font-weight="400" fill="#4a4a4a" text-anchor="start">0em</text><text x="210" y="318" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">default 0em</text><text x="650" y="354" font-size="12" font-weight="400" fill="#4a4a4a" text-anchor="end">0.32em</text><text x="30" y="388" font-size="14" font-weight="400" fill="#1a1a1a" text-anchor="start">Line length</text><rect x="210" y="378" width="440" height="10" rx="5" fill="#dcdcdc"/><rect x="210" y="378" width="440" height="10" rx="5" fill="#0b57d0"/><circle cx="405.55555555555554" cy="383" r="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="210" y="408" font-size="12" font-weight="400" fill="#4a4a4a" text-anchor="start">45ch</text><text x="405.55555555555554" y="372" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">default 65ch</text><text x="650" y="408" font-size="12" font-weight="400" fill="#4a4a4a" text-anchor="end">90ch</text><text x="30" y="442" font-size="14" font-weight="400" fill="#1a1a1a" text-anchor="start">Paragraph spacing</text><rect x="210" y="432" width="440" height="10" rx="5" fill="#dcdcdc"/><rect x="210" y="432" width="440" height="10" rx="5" fill="#0b57d0"/><circle cx="430" cy="437" r="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/><text x="210" y="462" font-size="12" font-weight="400" fill="#4a4a4a" text-anchor="start">0.5em</text><text x="430" y="426" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">default 1.5em</text><text x="650" y="462" font-size="12" font-weight="400" fill="#4a4a4a" text-anchor="end">2.5em</text></svg>
