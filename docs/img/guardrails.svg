<svg xmlns="http://www.w3.org/2000/svg" width="820" height="402" viewBox="0 0 820 402" role="img" aria-label="Guardrails turning unsafe input into safe settings" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title>Guardrails turning unsafe input into safe settings</title><rect x="0" y="0" width="820" height="402" rx="0" fill="#ffffff"/><text x="30" y="34" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="start">Guardrails in action: guard() output</text><text x="30" y="56" font-size="13" font-weight="400" fill="#4a4a4a" text-anchor="start">Generated by calling the real function. Every adjustment is reported to the reader.</text><rect x="30" y="76" width="760" height="44" rx="8" fill="#f4f4f4"/><text x="46" y="105" font-size="14" font-weight="400" fill="#1a1a1a" text-anchor="start">Reader sets text to 99px</text><text x="774" y="105" font-size="13" font-weight="600" fill="#0b57d0" text-anchor="end">→ sizePx limited to 32</text><rect x="30" y="128" width="760" height="44" rx="8" fill="#f4f4f4"/><text x="46" y="157" font-size="14" font-weight="400" fill="#1a1a1a" text-anchor="start">Reader picks 300 weight at 14px</text><text x="774" y="157" font-size="13" font-weight="600" fill="#0b57d0" text-anchor="end">→ weight raised to 400</text><rect x="30" y="180" width="760" height="44" rx="8" fill="#f4f4f4"/><text x="46" y="209" font-size="14" font-weight="400" fill="#1a1a1a" text-anchor="start">Dark theme, weight 400</text><text x="774" y="209" font-size="13" font-weight="600" fill="#0b57d0" text-anchor="end">→ weight raised to 450</text><rect x="30" y="232" width="760" height="44" rx="8" fill="#f4f4f4"/><text x="46" y="261" font-size="14" font-weight="400" fill="#1a1a1a" text-anchor="start">85ch line with 1.4 leading</text><text x="774" y="261" font-size="13" font-weight="600" fill="#0b57d0" text-anchor="end">→ line height raised to 1.6 for a long line</text><rect x="30" y="284" width="760" height="44" rx="8" fill="#f4f4f4"/><text x="46" y="313" font-size="14" font-weight="400" fill="#1a1a1a" text-anchor="start">Justified text, hyphenation off</text><text x="774" y="313" font-size="13" font-weight="600" fill="#0b57d0" text-anchor="end">→ justified text needs hyphenation; using left</text><rect x="30" y="336" width="760" height="44" rx="8" fill="#f4f4f4"/><text x="46" y="365" font-size="14" font-weight="400" fill="#1a1a1a" text-anchor="start">Letter spacing 0.5em</text><text x="774" y="365" font-size="13" font-weight="600" fill="#0b57d0" text-anchor="end">→ letterSpacingEm limited to 0.16</text></svg>
