<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="Five token layers feeding resolve, guard and fixContrast" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title>Five token layers feeding resolve, guard and fixContrast</title><rect x="0" y="0" width="900" height="420" rx="0" fill="#ffffff"/><text x="30" y="34" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="start">Five token layers: each can only override the one below</text><rect x="30" y="56" width="560" height="54" rx="8" fill="#0b57d0" stroke="#6b6b6b" stroke-width="2"/><text x="52" y="80" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">5  Reader overrides</text><text x="52" y="100" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="start">the reader’s own choices · Aa panel</text><rect x="30" y="120" width="560" height="54" rx="8" fill="#ffffff" stroke="#6b6b6b" stroke-width="2"/><text x="52" y="144" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">4  OS and browser preferences</text><text x="52" y="164" font-size="12.5" font-weight="400" fill="#1a1a1a" text-anchor="start">color scheme · contrast · reduced motion · forced colors</text><rect x="30" y="184" width="560" height="54" rx="8" fill="#ffffff" stroke="#6b6b6b" stroke-width="2"/><text x="52" y="208" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">3  Brand theme</text><text x="52" y="228" font-size="12.5" font-weight="400" fill="#1a1a1a" text-anchor="start">a generated system, defaults inside the ranges</text><rect x="30" y="248" width="560" height="54" rx="8" fill="#ffffff" stroke="#6b6b6b" stroke-width="2"/><text x="52" y="272" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">2  Semantic tokens</text><text x="52" y="292" font-size="12.5" font-weight="400" fill="#1a1a1a" text-anchor="start">bg · surface · ink · accent · status</text><rect x="30" y="312" width="560" height="54" rx="8" fill="#1a1a1a" stroke="#6b6b6b" stroke-width="2"/><text x="52" y="336" font-size="16" font-weight="700" fill="#fafaf9" text-anchor="start">1  Research baseline</text><text x="52" y="356" font-size="12.5" font-weight="400" fill="#fafaf9" text-anchor="start">safe ranges, never editable by brands or readers</text><rect x="640" y="56" width="230" height="58" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/><text x="755" y="81" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">resolve()</text><text x="755" y="101" font-size="11.5" font-weight="400" fill="#4a4a4a" text-anchor="middle">merge layers 1 to 5</text><path d="M755 116 v14" stroke="#1a1a1a" stroke-width="2"/><path d="M749 126 l6 6 l6 -6" fill="none" stroke="#1a1a1a" stroke-width="2"/><rect x="640" y="134" width="230" height="58" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/><text x="755" y="159" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">guard()</text><text x="755" y="179" font-size="11.5" font-weight="400" fill="#4a4a4a" text-anchor="middle">clamp · weight · measure · justify</text><path d="M755 194 v14" stroke="#1a1a1a" stroke-width="2"/><path d="M749 204 l6 6 l6 -6" fill="none" stroke="#1a1a1a" stroke-width="2"/><rect x="640" y="212" width="230" height="58" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/><text x="755" y="237" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">fixContrast()</text><text x="755" y="257" font-size="11.5" font-weight="400" fill="#4a4a4a" text-anchor="middle">OKLCH lightness only</text><path d="M755 272 v14" stroke="#1a1a1a" stroke-width="2"/><path d="M749 282 l6 6 l6 -6" fill="none" stroke="#1a1a1a" stroke-width="2"/><rect x="640" y="290" width="230" height="58" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/><text x="755" y="315" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">CSS variables</text><text x="755" y="335" font-size="11.5" font-weight="400" fill="#4a4a4a" text-anchor="middle">applied before first paint</text><path d="M594 190 H636" stroke="#1a1a1a" stroke-width="2"/><path d="M630 184 l6 6 l-6 6" fill="none" stroke="#1a1a1a" stroke-width="2"/></svg>
