<svg xmlns="http://www.w3.org/2000/svg" width="820" height="459" viewBox="0 0 820 459" role="img" aria-label="The Legible type scale" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title>The Legible type scale</title><rect x="0" y="0" width="820" height="475" rx="0" fill="#ffffff"/><text x="30" y="34" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="start">Type scale: base 18px, ratio 1.25</text><text x="30" y="56" font-size="13" font-weight="400" fill="#4a4a4a" text-anchor="start">Sans is Inter. Serif (Source Serif 4) and Atkinson Hyperlegible are one tap away in the Reader.</text><text x="30" y="128" font-size="44" font-weight="700" fill="#1a1a1a" text-anchor="start">Legible reading</text><text x="790" y="128" font-size="12" font-weight="400" fill="#4a4a4a" text-anchor="end">display · 44px/50px</text><text x="30" y="187" font-size="35" font-weight="700" fill="#1a1a1a" text-anchor="start">Legible reading</text><text x="790" y="187" font-size="12" font-weight="400" fill="#4a4a4a" text-anchor="end">h2 · 35px/42px</text><text x="30" y="240" font-size="28" font-weight="650" fill="#1a1a1a" text-anchor="start">Legible reading</text><text x="790" y="240" font-size="12" font-weight="400" fill="#4a4a4a" text-anchor="end">h3 · 28px/36px</text><text x="30" y="288" font-size="22" font-weight="600" fill="#1a1a1a" text-anchor="start">Legible reading</text><text x="790" y="288" font-size="12" font-weight="400" fill="#4a4a4a" text-anchor="end">h4 · 22px/30px</text><text x="30" y="332" font-size="18" font-weight="400" fill="#1a1a1a" text-anchor="start">Legible reading</text><text x="790" y="332" font-size="12" font-weight="400" fill="#4a4a4a" text-anchor="end">body · 18px/27px</text><text x="30" y="375" font-size="16" font-weight="500" fill="#1a1a1a" text-anchor="start">Legible reading</text><text x="790" y="375" font-size="12" font-weight="400" fill="#4a4a4a" text-anchor="end">ui · 16px/24px</text><text x="30" y="415" font-size="14" font-weight="400" fill="#1a1a1a" text-anchor="start">Legible reading</text><text x="790" y="415" font-size="12" font-weight="400" fill="#4a4a4a" text-anchor="end">caption · 14px/20px</text></svg>
